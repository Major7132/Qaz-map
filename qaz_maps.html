<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>QAZ MAPS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202a}
#map{height:100%;width:100%;background:#e9eef2}.top{position:absolute;z-index:1000;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center}
.brand{background:#fff;padding:12px 14px;border-radius:15px;box-shadow:0 3px 14px #0002;font-weight:800;color:#176b55;white-space:nowrap}
.search{flex:1;display:flex;background:#fff;border-radius:15px;box-shadow:0 3px 14px #0002;padding:0 12px;align-items:center}
.search input{width:100%;border:0;outline:0;padding:14px 4px;font-size:15px;background:transparent}
.panel{position:absolute;z-index:1000;bottom:14px;left:12px;right:12px;background:#fff;border-radius:20px;padding:12px;box-shadow:0 3px 18px #0002}
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.actions button,.panel button{border:0;border-radius:12px;background:#f1f5f4;padding:10px 4px;font-size:12px;color:#1c3c34}
.actions button b{display:block;font-size:18px;margin-bottom:4px}.actions button.active{background:#d9f3e9;color:#08744f}
.status{font-size:12px;color:#68757d;padding:9px 3px 1px}
.leaflet-control-attribution{font-size:9px!important}
</style>
</head>
<body>
<div id="map"></div>
<div class="top"><div class="brand">QAZ MAPS</div><div class="search"><span>⌕</span><input id="q" placeholder="Поиск места или адреса"><button onclick="searchPlace()" style="border:0;background:none;font-size:18px">➜</button></div></div>
<div class="panel"><div class="actions">
<button id="route" onclick="routeMode()"><b>➤</b>Маршрут</button>
<button id="sat" onclick="toggleSat()"><b>🌍</b>Спутник</button>
<button onclick="locate()"><b>◎</b>Моё место</button>
<button id="traffic" onclick="toggleTraffic()"><b>🚦</b>Пробки</button>
<button onclick="savePlace()"><b>☆</b>Избранное</button>
</div><div class="status" id="status">Карта Актобе · Нажми на карту, чтобы выбрать точку</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
<script>
const map=L.map('map',{zoomControl:false}).setView([50.2839,57.1670],13);
L.control.zoom({position:'bottomright'}).addTo(map);
const streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'});
let sat=false,traffic=false,routeOn=false,points=[],routeControl=null,lastMarker=null;
function msg(t){document.getElementById('status').textContent=t}
function toggleSat(){sat=!sat;if(sat){map.removeLayer(streets);satellite.addTo(map)}else{map.removeLayer(satellite);streets.addTo(map)}document.getElementById('sat').classList.toggle('active',sat);msg(sat?'Спутниковый режим':'Обычная карта')}
function toggleTraffic(){traffic=!traffic;document.getElementById('traffic').classList.toggle('active',traffic);msg(traffic?'Слой пробок недоступен: нужен отдельный источник данных':'Пробки выключены')}
function locate(){if(!navigator.geolocation){msg('Геолокация не поддерживается');return}msg('Определяем местоположение…');navigator.geolocation.getCurrentPosition(p=>{let ll=[p.coords.latitude,p.coords.longitude];map.setView(ll,16);L.marker(ll).addTo(map).bindPopup('Вы здесь').openPopup();msg('Ваше местоположение найдено')},()=>msg('Не удалось получить геолокацию. Разреши доступ в браузере'))}
async function searchPlace(){let q=document.getElementById('q').value.trim();if(!q)return;msg('Ищем…');try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));let d=await r.json();if(!d.length){msg('Ничего не найдено');return}let ll=[+d[0].lat,+d[0].lon];map.setView(ll,16);if(lastMarker)map.removeLayer(lastMarker);lastMarker=L.marker(ll).addTo(map).bindPopup(d[0].display_name).openPopup();msg('Найдено: '+d[0].display_name)}catch(e){msg('Ошибка поиска. Проверь интернет')}}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')searchPlace()});
function routeMode(){routeOn=!routeOn;points=[];if(routeControl){map.removeControl(routeControl);routeControl=null}document.getElementById('route').classList.toggle('active',routeOn);msg(routeOn?'Выбери на карте начало и конец маршрута':'Режим маршрута выключен')}
map.on('click',e=>{if(!routeOn)return;points.push(e.latlng);L.marker(e.latlng).addTo(map);if(points.length===1){msg('Начало выбрано. Теперь выбери пункт назначения')}if(points.length===2){routeOn=false;document.getElementById('route').classList.remove('active');routeControl=L.Routing.control({waypoints:points,addWaypoints:false,routeWhileDragging:false,show:false,createMarker:()=>null}).addTo(map);msg('Строим автомобильный маршрут…');points=[]}});
function savePlace(){let c=map.getCenter(),arr=JSON.parse(localStorage.getItem('qazfav')||'[]');arr.push({lat:c.lat,lng:c.lng});localStorage.setItem('qazfav',JSON.stringify(arr));msg('Текущая точка сохранена в избранное ('+arr.length+')')}
</script>
</body></html>


<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QAZ MAPS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f2;color:#202820}
#map{position:absolute;inset:0;z-index:1}
.top{position:absolute;z-index:500;top:10px;left:12px;right:12px}
.brand,.search,.actions{background:white;border-radius:18px;box-shadow:0 5px 20px #0002}
.brand{display:flex;align-items:center;padding:10px;gap:10px;width:max-content}
.logo{font-size:30px;background:#f5eddf;border-radius:12px;padding:5px}
.brand b{font-size:19px;color:#276b48}
.brand small{display:block;color:#888;font-size:10px}
.search{margin-top:10px;padding:8px;display:flex;gap:6px}
input{border:0;outline:0;flex:1;min-width:0;font-size:15px;padding:8px}
button{border:0;cursor:pointer}
.search button{background:#276b48;color:white;border-radius:12px;padding:10px}
.controls{position:absolute;z-index:500;right:12px;top:150px;display:grid;gap:8px}
.controls button{background:white;border-radius:14px;width:45px;height:45px;font-size:20px;box-shadow:0 4px 15px #0002}
.bottom{position:absolute;z-index:500;bottom:15px;left:12px;right:12px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);padding:8px}
.action{background:white;color:#68736a;padding:9px 2px;font-size:11px;border-radius:12px}
.action span{display:block;font-size:21px;margin-bottom:4px}
.action.active{background:#e7f1e9;color:#276b48}
.results{display:none;background:white;border-radius:14px;margin-top:6px;max-height:35vh;overflow:auto;box-shadow:0 5px 20px #0002}
.result{padding:12px;border-bottom:1px solid #eee;font-size:14px}
.result small{display:block;color:#888;margin-top:4px}
.toast{display:none;position:absolute;z-index:900;bottom:100px;left:50%;transform:translateX(-50%);background:#26362c;color:white;padding:12px;border-radius:12px;font-size:13px}
.route{display:none;background:white;border-radius:16px;padding:13px;margin-bottom:8px;box-shadow:0 4px 15px #0002}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
 <div class="brand">
  <div class="logo">🍂</div>
  <div><b>QAZ MAPS</b><small>ТВОЙ ГОРОД · ТВОЙ МАРШРУТ</small></div>
 </div>
 <div class="search">
  <input id="search" placeholder="Куда отправимся?">
  <button onclick="searchPlaces()">Найти</button>
 </div>
 <div class="results" id="results"></div>
</div>

<div class="controls">
 <button onclick="map.zoomIn()">＋</button>
 <button onclick="map.zoomOut()">−</button>
 <button onclick="toggleSatellite()">▧</button>
 <button onclick="toggleTraffic()">🚦</button>
 <button onclick="locate()">◎</button>
</div>

<div class="bottom">
 <div class="route" id="route"></div>
 <div class="actions">
  <button class="action" onclick="buildRoute()"><span>➤</span>Маршрут</button>
  <button class="action" onclick="toggleFavorite()"><span>☆</span>Избранное</button>
  <button class="action" onclick="locate()"><span>◎</span>Где я</button>
  <button class="action" onclick="home()"><span>⌂</span>Обзор</button>
 </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([50.2839,57.167],13);
const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 attribution:'© OpenStreetMap',maxZoom:19
}).addTo(map);
const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
let satelliteOn=false,trafficOn=false;
let myPosition=null,selected=null,marker=null,routeLine=null;
let favorites=JSON.parse(localStorage.getItem('qaz_favorites')||'[]');

function toast(t){
 const el=document.getElementById('toast');
 el.textContent=t;el.style.display='block';
 setTimeout(()=>el.style.display='none',2500);
}
function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function searchPlaces(){
 const q=document.getElementById('search').value.trim();
 if(!q)return toast('Введи название места');
 const box=document.getElementById('results');
 box.style.display='block';box.innerHTML='<div class="result">Ищем...</div>';
 try{
  const data=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=ru&q='+encodeURIComponent(q)).then(r=>r.json());
  if(!data.length){box.innerHTML='<div class="result">Ничего не найдено</div>';return}
  box.innerHTML=data.map((p,i)=>`<div class="result" data-i="${i}">${escapeHTML(p.name||p.display_name.split(',')[0])}<small>${escapeHTML(p.display_name)}</small></div>`).join('');
  box.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>choose(data[+el.dataset.i]));
 }catch(e){box.innerHTML='<div class="result">Ошибка поиска. Проверь интернет.</div>'}
}
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')searchPlaces()});
function choose(p){
 selected={lat:+p.lat,lon:+p.lon,name:p.display_name};
 if(marker)map.removeLayer(marker);
 marker=L.marker([selected.lat,selected.lon]).addTo(map).bindPopup(escapeHTML(selected.name.split(',')[0])).openPopup();
 map.setView([selected.lat,selected.lon],16);
 document.getElementById('search').value=selected.name.split(',')[0];
 document.getElementById('results').style.display='none';
}
function toggleSatellite(){
 satelliteOn=!satelliteOn;
 if(satelliteOn){map.removeLayer(street);satellite.addTo(map)}
 else{map.removeLayer(satellite);street.addTo(map)}
 toast(satelliteOn?'Спутник включён':'Обычная карта');
}
function toggleTraffic(){
 trafficOn=!trafficOn;
 toast(trafficOn?'Режим пробок выбран. Живые данные пока не подключены':'Пробки выключены');
}
function locate(){
 if(!navigator.geolocation)return toast('Геолокация недоступна');
 toast('Определяем местоположение...');
 navigator.geolocation.getCurrentPosition(p=>{
  myPosition=[p.coords.latitude,p.coords.longitude];
  L.circleMarker(myPosition,{radius:9,color:'white',weight:4,fillColor:'#2676d2',fillOpacity:1}).addTo(map);
  map.setView(myPosition,16);toast('Ты здесь!');
 },()=>toast('Разреши доступ к геолокации'));
}
function toggleFavorite(){
 if(!selected)return toast('Сначала выбери место');
 const i=favorites.findIndex(f=>f.lat===selected.lat&&f.lon===selected.lon);
 if(i>=0){favorites.splice(i,1);toast('Удалено из избранного')}
 else{favorites.push(selected);toast('Добавлено в избранное')}
 localStorage.setItem('qaz_favorites',JSON.stringify(favorites));
}
async function buildRoute(){
 if(!selected)return toast('Сначала найди место');
 const start=myPosition||[map.getCenter().lat,map.getCenter().lng];
 const end=[selected.lat,selected.lon];
 try{
  const url=`https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`;
  const data=await fetch(url).then(r=>r.json());
  if(!data.routes?.length)return toast('Маршрут не найден');
  if(routeLine)map.removeLayer(routeLine);
  routeLine=L.geoJSON(data.routes[0].geometry,{style:{color:'#276b48',weight:6}}).addTo(map);
  map.fitBounds(routeLine.getBounds(),{padding:[40,40]});
  const r=data.routes[0];
  document.getElementById('route').style.display='block';
  document.getElementById('route').innerHTML=`<b>Маршрут готов</b><br>${(r.distance/1000).toFixed(1)} км · около ${Math.round(r.duration/60)} мин <button onclick="clearRoute()">✕</button>`;
  toast('Маршрут построен');
 }catch(e){toast('Не удалось построить маршрут')}
}
function clearRoute(){
 if(routeLine)map.removeLayer(routeLine);
 routeLine=null;document.getElementById('route').style.display='none';
}
function home(){
 map.setView([50.2839,57.167],13);
 toast('Обзор Актобе');
}
map.on('click',e=>{
 selected={lat:e.latlng.lat,lon:e.latlng.lng,name:'Выбранная точка'};
 if(marker)map.removeLayer(marker);
 marker=L.marker(e.latlng).addTo(map).bindPopup('Выбранная точка').openPopup();
});
</script>
</body>
</html>

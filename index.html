
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#191a20">
<title>QAZ MAPS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#191a20;color:white}
button{font-family:inherit;cursor:pointer}
#map{position:absolute;inset:0;z-index:1;background:#e7e9e7}
.leaflet-container{background:#e7e9e7}
.leaflet-control-attribution{font-size:9px!important}

.logo{
 position:absolute;z-index:500;top:calc(env(safe-area-inset-top) + 12px);
 left:50%;transform:translateX(-50%);
 background:linear-gradient(135deg,#167b42,#29ce62);
 border-radius:40px;padding:13px 23px;
 font-size:21px;font-weight:900;white-space:nowrap;
 box-shadow:0 7px 25px #0005
}
.logo span{margin-right:7px}

.controls{
 position:absolute;z-index:500;right:15px;
 top:calc(env(safe-area-inset-top) + 85px);
 display:flex;flex-direction:column;gap:12px
}
.control{
 width:55px;height:55px;border:0;border-radius:18px;
 background:#191a20;color:white;font-size:25px;
 box-shadow:0 5px 15px #0005
}
.control:active{transform:scale(.94)}

.weather{
 position:absolute;z-index:500;left:15px;
 bottom:calc(320px + env(safe-area-inset-bottom));
 background:#191a20;padding:13px 17px;
 border-radius:17px;font-size:18px
}

.quick{
 position:absolute;z-index:500;left:15px;right:15px;
 bottom:calc(235px + env(safe-area-inset-bottom));
 display:flex;gap:9px;overflow-x:auto;
 scrollbar-width:none
}
.quick button{
 border:0;border-radius:15px;background:#191a20;
 color:white;padding:14px 17px;font-size:14px;
 white-space:nowrap
}

.panel{
 position:absolute;z-index:600;left:0;right:0;bottom:0;
 background:#242424;border-radius:28px 28px 0 0;
 padding:12px 15px calc(12px + env(safe-area-inset-bottom));
 box-shadow:0 -5px 25px #0005
}
.handle{width:48px;height:5px;border-radius:8px;background:#444;margin:0 auto 16px}

.searchrow{display:flex;gap:9px}
.search{
 flex:1;display:flex;align-items:center;
 background:#333;border-radius:17px;padding:0 13px;min-width:0
}
.search .glass{font-size:25px;color:#aaa}
.search input{
 flex:1;min-width:0;background:none;border:0;
 outline:0;color:white;font-size:17px;padding:17px 10px
}
.search input::placeholder{color:#999}
.search button{border:0;background:none;color:#aaa;font-size:22px}
.menu{
 width:62px;border:0;border-radius:17px;
 background:#333;color:white;font-size:26px
}

.results{
 display:none;margin-top:9px;background:#333;
 border-radius:14px;max-height:180px;overflow-y:auto
}
.result{padding:13px;border-bottom:1px solid #494949;font-size:14px}
.result small{display:block;color:#aaa;margin-top:4px}

.routebox{
 display:none;margin-top:9px;padding:13px;
 background:#333;border-radius:13px;font-size:14px
}
.routebox button{float:right;border:0;background:none;color:white;font-size:20px}

.tabs{
 display:grid;grid-template-columns:repeat(5,1fr);
 text-align:center;margin-top:17px
}
.tab{border:0;background:none;color:#999;font-size:12px;padding:5px 0}
.tab b{display:block;font-size:26px;margin-bottom:6px}
.tab.active{color:#20c65a}

.toast{
 display:none;position:absolute;z-index:1000;
 left:50%;transform:translateX(-50%);
 bottom:calc(245px + env(safe-area-inset-bottom));
 background:#252525;border:1px solid #444;
 padding:12px 17px;border-radius:13px;
 white-space:nowrap;font-size:14px
}

@media(min-width:700px){
 .panel{width:440px;left:50%;right:auto;transform:translateX(-50%)}
}
</style>
</head>

<body>

<div id="map"></div>

<div class="logo"><span>🍂</span>QAZ MAPS</div>

<div class="controls">
 <button class="control" onclick="toggleSatellite()" title="Спутник">🛰️</button>
 <button class="control" onclick="locate()" title="Моё место">➤</button>
 <button class="control" onclick="map.zoomIn()">＋</button>
 <button class="control" onclick="map.zoomOut()">−</button>
</div>

<div class="weather">🌙 5°</div>

<div class="quick">
 <button onclick="showFavorites()">☆ Избранное</button>
 <button onclick="goHome()">⌂ Обзор</button>
 <button onclick="buildRoute()">🚗 Маршрут</button>
 <button onclick="saveFavorite()">☆ Сохранить точку</button>
</div>

<div class="panel">
 <div class="handle"></div>

 <div class="searchrow">
  <div class="search">
   <span class="glass">⌕</span>
   <input id="query" placeholder="Поиск мест и адресов">
   <button onclick="searchPlaces()">⌕</button>
  </div>
  <button class="menu" onclick="showMenu()">☰</button>
 </div>

 <div class="results" id="results"></div>
 <div class="routebox" id="routebox"></div>

 <div class="tabs">
  <button class="tab active" onclick="tab(this,'Поиск')"><b>▦</b>Поиск</button>
  <button class="tab" onclick="tab(this,'Проезд')"><b>〽</b>Проезд</button>
  <button class="tab" onclick="tab(this,'Навигатор')"><b>➤</b>Навигатор</button>
  <button class="tab" onclick="tab(this,'Избранное')"><b>☆</b>Избранное</button>
  <button class="tab" onclick="tab(this,'Советы')"><b>◇</b>Советы</button>
 </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// КАРТА
const map=L.map('map',{
 zoomControl:false,
 minZoom:3,
 maxZoom:19
}).setView([50.2839,57.167],14);

// ОБЫЧНАЯ КАРТА
const streets=L.tileLayer(
 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
 {
  maxZoom:19,
  attribution:'© OpenStreetMap',
  subdomains:'abc'
 }
).addTo(map);

// СПУТНИК
const satellite=L.tileLayer(
 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
 {
  maxZoom:19,
  maxNativeZoom:19,
  attribution:'© Esri'
 }
);

let satelliteOn=false;
let position=null;
let destination=null;
let route=null;
let marker=null;
let userMarker=null;

let favorites=[];
try{
 favorites=JSON.parse(localStorage.getItem('qaz_favorites')||'[]');
}catch(e){favorites=[]}

// УВЕДОМЛЕНИЯ
function toast(message){
 const el=document.getElementById('toast');
 el.textContent=message;
 el.style.display='block';
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>el.style.display='none',2600);
}

// ЗАЩИТА ТЕКСТА
function safeText(s){
 return String(s).replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

// ПРОВЕРКА ЗАГРУЗКИ КАРТЫ
streets.on('tileerror',()=>toast('Ошибка загрузки карты. Проверь интернет.'));
satellite.on('tileerror',()=>toast('Ошибка загрузки спутниковых снимков.'));

// ПЕРЕКЛЮЧЕНИЕ МЕНЮ
function tab(el,name){
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 el.classList.add('active');

 if(name==='Поиск'){
 document.getElementById('query').focus();
 toast('Поиск мест');
 }
 if(name==='Проезд'||name==='Навигатор')buildRoute();
 if(name==='Избранное')showFavorites();
 if(name==='Советы')toast('Советы QAZ MAPS скоро появятся');
}

// ПОИСК
async function searchPlaces(){
 const q=document.getElementById('query').value.trim();
 if(!q)return toast('Введи название или адрес');

 const box=document.getElementById('results');
 box.style.display='block';
 box.innerHTML='<div class="result">Ищем места...</div>';

 try{
 const data=await fetch(
 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=7&accept-language=ru&q='+encodeURIComponent(q)
 ).then(r=>r.json());

 if(!data.length){
 box.innerHTML='<div class="result">Ничего не найдено</div>';
 return;
 }

 box.innerHTML=data.map((p,i)=>`
 <div class="result" data-index="${i}">
 ${safeText(p.name||p.display_name.split(',')[0])}
 <small>${safeText(p.display_name)}</small>
 </div>`).join('');

 box.querySelectorAll('[data-index]').forEach(el=>{
 el.onclick=()=>selectPlace(data[Number(el.dataset.index)]);
 });

 }catch(e){
 box.innerHTML='<div class="result">Поиск временно недоступен</div>';
 }
}

document.getElementById('query').addEventListener('keydown',e=>{
 if(e.key==='Enter')searchPlaces();
});

// ВЫБРАТЬ МЕСТО
function selectPlace(p){
 destination={
 lat:Number(p.lat),
 lon:Number(p.lon),
 name:p.display_name||p.name||'Выбранная точка'
 };

 if(marker)map.removeLayer(marker);

 marker=L.marker([destination.lat,destination.lon])
 .addTo(map)
 .bindPopup(safeText(destination.name.split(',')[0]))
 .openPopup();

 map.setView([destination.lat,destination.lon],17);
 document.getElementById('results').style.display='none';
 document.getElementById('query').value=destination.name.split(',')[0];

 toast('Место найдено');
}

// СПУТНИК
function toggleSatellite(){
 if(satelliteOn){
 map.removeLayer(satellite);
 streets.addTo(map);
 satelliteOn=false;
 toast('Обычная карта включена');
 }else{
 map.removeLayer(streets);
 satellite.addTo(map);
 satelliteOn=true;
 toast('Спутниковый режим включён');
 }
}

// ГЕОЛОКАЦИЯ
function locate(){
 if(!navigator.geolocation)return toast('Геолокация недоступна');

 toast('Определяем местоположение...');

 navigator.geolocation.getCurrentPosition(p=>{
 position=[p.coords.latitude,p.coords.longitude];

 if(userMarker)map.removeLayer(userMarker);

 userMarker=L.circleMarker(position,{
 radius:10,
 color:'#ffffff',
 weight:4,
 fillColor:'#20c65a',
 fillOpacity:1
 }).addTo(map).bindPopup('Ты здесь');

 map.setView(position,17);
 userMarker.openPopup();
 toast('Местоположение найдено');

 },()=>{
 toast('Разреши доступ к геолокации в Safari');
 },{enableHighAccuracy:true,timeout:15000});
}

// МАРШРУТ
async function buildRoute(){
 if(!destination){
 toast('Сначала выбери место через поиск или карту');
 return;
 }

 const start=position||[map.getCenter().lat,map.getCenter().lng];
 const end=[destination.lat,destination.lon];

 toast('Строим маршрут...');

 try{
 const url='https://router.project-osrm.org/route/v1/driving/'
 +start[1]+','+start[0]+';'+end[1]+','+end[0]
 +'?overview=full&geometries=geojson';

 const data=await fetch(url).then(r=>r.json());

 if(!data.routes||!data.routes.length){
 toast('Маршрут не найден');
 return;
 }

 if(route)map.removeLayer(route);

 route=L.geoJSON(data.routes[0].geometry,{
 style:{
 color:'#20c65a',
 weight:7,
 opacity:1
 }
 }).addTo(map);

 map.fitBounds(route.getBounds(),{padding:[45,45]});

 const r=data.routes[0];
 const box=document.getElementById('routebox');
 box.style.display='block';
 box.innerHTML=
 '<b>🚗 Маршрут готов</b>'+
 '<button onclick="clearRoute()">✕</button>'+
 '<br>'+ (r.distance/1000).toFixed(1)+' км · около '+
 Math.round(r.duration/60)+' мин';

 toast('Маршрут построен');

 }catch(e){
 toast('Не удалось построить маршрут');
 }
}

function clearRoute(){
 if(route)map.removeLayer(route);
 route=null;
 document.getElementById('routebox').style.display='none';
 toast('Маршрут удалён');
}

// ИЗБРАННОЕ
function saveFavorite(){
 if(!destination)return toast('Сначала выбери точку');

 const exists=favorites.some(f=>
 Math.abs(f.lat-destination.lat)<0.000001&&
 Math.abs(f.lon-destination.lon)<0.000001
 );

 if(exists)return toast('Уже есть в избранном');

 favorites.push(destination);
 localStorage.setItem('qaz_favorites',JSON.stringify(favorites));
 toast('☆ Сохранено в избранное');
}

function showFavorites(){
 const box=document.getElementById('results');
 box.style.display='block';

 if(!favorites.length){
 box.innerHTML='<div class="result">Избранное пока пустое</div>';
 return;
 }

 box.innerHTML=favorites.map((f,i)=>`
 <div class="result" data-favorite="${i}">
 ☆ ${safeText(f.name.split(',')[0])}
 <small>${safeText(f.name)}</small>
 </div>`).join('');

 box.querySelectorAll('[data-favorite]').forEach(el=>{
 el.onclick=()=>selectPlace(favorites[Number(el.dataset.favorite)]);
 });
}

// ОБЗОР
function goHome(){
 map.setView([50.2839,57.167],14);
 toast('Обзор Актобе');
}

// МЕНЮ
function showMenu(){
 const choice=prompt(
 'QAZ MAPS\n\n1 — Избранное\n2 — Очистить маршрут\n3 — Обзор Актобе'
 );

 if(choice==='1')showFavorites();
 if(choice==='2')clearRoute();
 if(choice==='3')goHome();
}

// ВЫБОР ТОЧКИ НА КАРТЕ
map.on('click',e=>{
 destination={
 lat:e.latlng.lat,
 lon:e.latlng.lng,
 name:'Выбранная точка'
 };

 if(marker)map.removeLayer(marker);

 marker=L.marker(e.latlng)
 .addTo(map)
 .bindPopup('Выбранная точка')
 .openPopup();

 toast('Точка выбрана. Можно сохранить или построить маршрут.');
});
</script>

</body>
</html>
